# Netlify: no build step, the repo root is the site.
[build]
  publish = "."

# kalimat.co.rw/admin opens the admin app (admin.html). The storefront stays at /.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Backend source lives in the repo but is not served.
# Engineering files live in the repo but are not part of the public site.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Files that change with each release: always revalidate (a cheap 304 when unchanged).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/admin.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Images change rarely: cache for 30 days.
[[headers]]
  for = "/assets/bg/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
